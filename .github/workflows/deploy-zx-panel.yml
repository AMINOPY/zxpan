name: Deploy ZX PANEL

on:
  push:
    branches: [main]
    paths:
      - "Source.js"
      - "wrangler.panel.jsonc"
      - ".github/workflows/deploy-zx-panel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check deployment credentials
        id: credentials
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Deployment skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy ZX PANEL Worker
        if: steps.credentials.outputs.configured == 'true'
        run: npm run deploy:panel
